name: CI & Container Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Start services for testing
        run: |
          docker compose up -d --wait postgres redis migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/linkpulse
          REDIS_URL: redis://localhost:6379/0
          API_KEY: dev-secret-api-key
          CHAOS_ENABLED: "true"
        run: |
          pytest -v tests/

      - name: Teardown services
        if: always()
        run: |
          docker compose down -v

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-,format=short

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-gitops:
    name: Bump GitOps Image Tag
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: nirojasmar/linkpulse-argo-gitops
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}
      - name: Set image tag in overlay
        run: |
          cd overlays/oci
          kustomize edit set image ghcr.io/nirojasmar/linkpulse=ghcr.io/nirojasmar/linkpulse:git-${GITHUB_SHA::7}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "deploy: git-${GITHUB_SHA::7}"
            git push
          fi
