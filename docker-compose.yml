services:
  postgres:
    image: postgres:16-alpine
    container_name: linkpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkpulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/linkpulse
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-api-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/linkpulse
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-api-key
      BASE_URL: http://localhost:8000
      CHAOS_ENABLED: "true"
      POD_NAME: compose-api
      APP_VERSION: 0.1.0
      GIT_SHA: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/linkpulse
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-api-key
      POD_NAME: compose-worker
      APP_VERSION: 0.1.0
      GIT_SHA: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
